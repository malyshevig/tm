services:
  tm-app:
    build: .
    env_file: .env
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=gek
      - DB_PORT=5432
      - DB_USER=ilia
      - DB_PASSWORD=begemot
      - DB_NAME=tm
    command: sh -c "uvicorn tm.app:app --host 0.0.0.0 --port 8000 --workers 4 2>&1 | tee /app/logs/app.log"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  tm-audit-app:
    build: .
    env_file: .env
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=gek
      - DB_PORT=5432
      - DB_USER=ilia
      - DB_PASSWORD=begemot
      - DB_NAME=tm
    command: sh -c "python -m tm.audit -i $$HOSTNAME 2>&1 | tee /app/logs/audit.log"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "82:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    depends_on:
      tm-app:
        condition: service_healthy
    restart: unless-stopped

networks:
  app-network:
    driver: bridge